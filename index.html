<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --primary: #00d1b2;
      --bg: #121212;
      --card: #1e1e1e;
      --green: #2ecc71;
      --orange: #f39c12;
      --red: #e74c3c;
      --gold: #ffd700;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      max-width: 600px;
      margin: auto;
      padding: 15px;
      color: white;
      background:
        linear-gradient(rgba(18, 18, 18, 0.85), rgba(18, 18, 18, 0.95)),
        url('logo.jpg') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    .nav-menu {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 10px;
      overflow-x: auto;
    }

    .nav-menu a {
      padding: 10px 15px;
      color: white;
      background: #333;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      white-space: nowrap;
      transition: 0.2s;
    }

    .nav-menu a.active {
      color: #121212;
      background: var(--primary);
    }

    .header {
      margin-bottom: 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: var(--primary);
      font-size: 1.8rem;
    }

    p {
      margin-top: 5px;
      color: #aaa;
      font-size: 0.85rem;
    }

    .filter-container {
      margin-bottom: 20px;
      padding: 15px;
      background: var(--card);
      border: 1px solid #333;
      border-radius: 12px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #aaa;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    select {
      width: 100%;
      padding: 12px;
      color: white;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }

    optgroup {
      color: var(--primary);
      background: #1e1e1e;
      font-weight: bold;
    }

    option {
      color: white;
      background: #2a2a2a;
    }

    .btn-scan {
      width: 100%;
      padding: 16px;
      color: #121212;
      background: var(--primary);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn-scan:disabled,
    .btn-analisar:disabled,
    .btn-save:disabled {
      color: #888;
      background: #555;
      border-color: #555;
      cursor: not-allowed;
    }

    .resultados {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }

    .match-card {
      padding: 15px;
      background: var(--card);
      border-left: 4px solid var(--primary);
      border-radius: 12px;
    }

    .liga-tag {
      display: inline-block;
      margin-bottom: 10px;
      padding: 4px 8px;
      color: var(--primary);
      background: rgba(0, 209, 178, 0.1);
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: bold;
    }

    .confronto {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .time {
      flex: 1;
      text-align: center;
    }

    .btn-analisar {
      width: 100%;
      padding: 12px;
      color: var(--primary);
      background: #2a2a2a;
      border: 1px solid var(--primary);
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn-analisar:hover:not(:disabled) {
      color: #121212;
      background: var(--primary);
    }

    .painel-analise {
      display: none;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #333;
    }

    .prob-bar-container {
      display: flex;
      height: 10px;
      margin-bottom: 5px;
      overflow: hidden;
      background: #333;
      border-radius: 5px;
    }

    .prob-bar {
      height: 100%;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      color: #ccc;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .market-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .market-item {
      padding: 10px;
      background: #252525;
      border: 1px solid #333;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .market-item span {
      display: block;
    }

    .market-item span:first-child {
      margin-bottom: 4px;
      color: #aaa;
      font-size: 0.9rem;
    }

    .market-item span:last-child {
      color: var(--primary);
      font-size: 1.1rem;
      font-weight: bold;
    }

    .sugestao {
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      text-align: center;
      transition: 0.3s;
    }

    .btn-save {
      width: 100%;
      padding: 12px;
      color: white;
      background: #333;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .mensagem {
      padding: 20px;
      background: #252525;
      border: 1px dashed #555;
      border-radius: 8px;
      text-align: center;
    }

    .mensagem.erro {
      border-color: var(--red);
    }

    .mensagem.aviso {
      border-color: var(--orange);
    }

    .mensagem strong {
      display: block;
      margin-bottom: 8px;
    }

    .mensagem.erro strong {
      color: var(--red);
    }

    .mensagem.aviso strong {
      color: var(--orange);
    }

    #toast-container {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      color: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      font-family: 'Segoe UI', sans-serif;
      font-weight: bold;
      transform: translateX(120%);
      transition: transform 0.3s ease-in-out;
    }

    .toast.show {
      transform: translateX(0);
    }

    .toast.success {
      background: #2ecc71;
    }

    .toast.error {
      background: #e74c3c;
    }

    .toast.info {
      background: #3498db;
    }

    footer {
      margin-top: 40px;
      padding: 15px;
      color: #777;
      border-top: 1px solid #222;
      font-size: 0.75rem;
      text-align: center;
    }

    @media (max-width: 430px) {
      .market-grid {
        grid-template-columns: 1fr;
      }

      .stats {
        gap: 5px;
        font-size: 0.75rem;
      }
    }
  </style>
</head>

  <script>
    // A chave anon do Supabase pode aparecer no frontend, mas a tabela precisa
    // estar protegida por políticas de RLS no painel do Supabase.
    const SUPABASE_URL = 'https://tvdwgfytguwlsppvjvkk.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2ZHdnZnl0Z3V3bHNwcHZqdmtrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1Njk0OTEsImV4cCI6MjA5MjE0NTQ5MX0.mKbLRjWV3eoeAxUtMX-yY24hZQ-mN0aEtnhxk2pH5Us';

    const clienteSupabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY,
    );

    const btnEscanear = document.getElementById('btnEscanear');
    const listaResultados = document.getElementById('listaResultados');

    btnEscanear.addEventListener('click', buscarJogos);

    function mostrarToast(mensagem, tipo = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const icone = tipo === 'success' ? '✅' : tipo === 'error' ? '⚠️' : 'ℹ️';

      toast.className = `toast ${tipo}`;

      const spanIcone = document.createElement('span');
      const spanMensagem = document.createElement('span');
      spanIcone.textContent = icone;
      spanMensagem.textContent = mensagem;

      toast.append(spanIcone, spanMensagem);
      container.appendChild(toast);

      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function obterMensagemErro(dados, status) {
      if (!dados) return `Erro HTTP ${status}.`;

      if (typeof dados.detalhes === 'string') {
        return dados.detalhes;
      }

      if (dados.detalhes && typeof dados.detalhes === 'object') {
        return JSON.stringify(dados.detalhes);
      }

      return dados.erro || `Erro HTTP ${status}.`;
    }

    async function consultarBackend(action, parametros = {}) {
      const query = new URLSearchParams({ action, ...parametros });
      const resposta = await fetch(`/api/football?${query.toString()}`, {
        method: 'GET',
        headers: { Accept: 'application/json' },
      });

      let dados = null;

      try {
        dados = await resposta.json();
      } catch {
        throw new Error(`O servidor devolveu uma resposta inválida (${resposta.status}).`);
      }

      if (!resposta.ok) {
        throw new Error(obterMensagemErro(dados, resposta.status));
      }

      return dados;
    }

    function mostrarMensagem(tipo, titulo, texto) {
      listaResultados.innerHTML = '';

      const bloco = document.createElement('div');
      const strong = document.createElement('strong');
      const paragrafo = document.createElement('p');

      bloco.className = `mensagem ${tipo}`;
      strong.textContent = titulo;
      paragrafo.textContent = texto;

      bloco.append(strong, paragrafo);
      listaResultados.appendChild(bloco);
    }

    async function buscarJogos() {
      const ligaId = document.getElementById('filtroLiga').value;

      btnEscanear.disabled = true;
      btnEscanear.textContent = 'A carregar os jogos...';
      listaResultados.innerHTML = '';

      try {
        const dados = await consultarBackend('fixtures', {
          league: ligaId,
          limit: '15',
        });

        const jogos = Array.isArray(dados.response) ? dados.response : [];

        if (jogos.length === 0) {
          mostrarMensagem(
            'aviso',
            'Nenhum próximo jogo encontrado',
            'A API não devolveu partidas futuras para esta liga no momento.',
          );
          return;
        }

        jogos
          .sort(
            (a, b) =>
              new Date(a.fixture.date).getTime() -
              new Date(b.fixture.date).getTime(),
          )
          .forEach(renderizarCard);

        mostrarToast(`${jogos.length} jogo(s) carregado(s).`, 'success');
      } catch (erro) {
        console.error('Erro ao buscar jogos:', erro);

        mostrarMensagem(
          'erro',
          'Não foi possível carregar os jogos',
          erro instanceof Error ? erro.message : String(erro),
        );
      } finally {
        btnEscanear.disabled = false;
        btnEscanear.textContent = 'Carregar próximos jogos';
      }
    }

    function renderizarCard(jogoCompleto) {
      const jogo = jogoCompleto.fixture;
      const times = jogoCompleto.teams;
      const liga = jogoCompleto.league;

      if (!jogo || !times?.home || !times?.away || !liga) return;

      const timeCasa = times.home.name;
      const timeFora = times.away.name;
      const idCasa = Number(times.home.id);
      const idFora = Number(times.away.id);
      const idJogoAPI = Number(jogo.id);
      const ligaId = Number(liga.id);
      const temporada = Number(liga.season);

      const dataJogo = new Date(jogo.date);
      const dataFormatada = dataJogo.toLocaleDateString('pt-BR', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
      });
      const horaFormatada = dataJogo.toLocaleTimeString('pt-BR', {
        hour: '2-digit',
        minute: '2-digit',
      });

      let infoTempo = `${dataFormatada} às ${horaFormatada}`;
      const status = jogo.status?.short || 'NS';

      if (['1H', '2H', 'HT', 'ET', 'P', 'BT'].includes(status)) {
        infoTempo = '🔴 AO VIVO';
      } else if (['FT', 'AET', 'PEN'].includes(status)) {
        infoTempo = `Encerrado em ${dataFormatada}`;
      }

      const card = document.createElement('article');
      const ligaTag = document.createElement('div');
      const confronto = document.createElement('div');
      const casa = document.createElement('span');
      const versus = document.createElement('span');
      const fora = document.createElement('span');
      const botao = document.createElement('button');
      const painel = document.createElement('div');

      card.className = 'match-card';
      ligaTag.className = 'liga-tag';
      confronto.className = 'confronto';
      casa.className = 'time';
      fora.className = 'time';
      botao.className = 'btn-analisar';
      painel.className = 'painel-analise';

      ligaTag.textContent = `${liga.name} • Temporada ${temporada} • 🗓️ ${infoTempo}`;
      casa.textContent = timeCasa;
      casa.style.color = 'var(--green)';
      versus.textContent = 'X';
      versus.style.color = '#666';
      versus.style.fontSize = '0.8rem';
      versus.style.padding = '0 10px';
      fora.textContent = timeFora;
      fora.style.color = 'var(--orange)';
      botao.type = 'button';
      botao.textContent = '🎯 Extrair tabela e analisar';

      confronto.append(casa, versus, fora);
      card.append(ligaTag, confronto, botao, painel);
      listaResultados.appendChild(card);

      botao.addEventListener('click', () => {
        gerarAnaliseMatematicaReal({
          botao,
          painel,
          ligaId,
          temporada,
          idCasa,
          idFora,
          timeCasa,
          timeFora,
          idJogoAPI,
          dataHoraReal: jogo.date,
        });
      });
    }

    function numeroSeguro(valor, padrao = 0) {
      const numero = Number(valor);
      return Number.isFinite(numero) ? numero : padrao;
    }

    function media(valorA, valorB) {
      return (numeroSeguro(valorA) + numeroSeguro(valorB)) / 2;
    }

    function limitar(valor, minimo, maximo) {
      return Math.min(Math.max(valor, minimo), maximo);
    }

    function porcentagem(valor) {
      return Math.round(valor * 100);
    }

    async function gerarAnaliseMatematicaReal({
      botao,
      painel,
      ligaId,
      temporada,
      idCasa,
      idFora,
      timeCasa,
      timeFora,
      idJogoAPI,
      dataHoraReal,
    }) {
      botao.disabled = true;
      botao.textContent = '⏳ A analisar os dados...';

      try {
        const dados = await consultarBackend('standings', {
          league: String(ligaId),
          season: String(temporada),
        });

        const grupos = dados.response?.[0]?.league?.standings;

        if (!Array.isArray(grupos) || grupos.length === 0) {
          throw new Error(
            'Esta competição não possui tabela classificatória disponível para a temporada.',
          );
        }

        const tabelaCompleta = grupos.flat();
        const linhaCasa = tabelaCompleta.find(
          (linha) => Number(linha.team?.id) === idCasa,
        );
        const linhaFora = tabelaCompleta.find(
          (linha) => Number(linha.team?.id) === idFora,
        );

        if (!linhaCasa || !linhaFora) {
          throw new Error(
            'Um ou ambos os times não foram encontrados na tabela desta competição.',
          );
        }

        const dadosCasa = linhaCasa.home?.played > 0
          ? linhaCasa.home
          : linhaCasa.all;
        const dadosFora = linhaFora.away?.played > 0
          ? linhaFora.away
          : linhaFora.all;

        const jogosCasa = numeroSeguro(dadosCasa?.played);
        const jogosFora = numeroSeguro(dadosFora?.played);

        if (jogosCasa <= 0 || jogosFora <= 0) {
          throw new Error(
            'Ainda não existem partidas suficientes para calcular uma análise confiável.',
          );
        }

        const mediaCasaMarcados =
          numeroSeguro(dadosCasa.goals?.for) / jogosCasa;
        const mediaCasaSofridos =
          numeroSeguro(dadosCasa.goals?.against) / jogosCasa;
        const mediaForaMarcados =
          numeroSeguro(dadosFora.goals?.for) / jogosFora;
        const mediaForaSofridos =
          numeroSeguro(dadosFora.goals?.against) / jogosFora;

        let lambdaCasa = media(mediaCasaMarcados, mediaForaSofridos);
        let lambdaFora = media(mediaForaMarcados, mediaCasaSofridos);

        lambdaCasa = limitar(lambdaCasa, 0.25, 4);
        lambdaFora = limitar(lambdaFora, 0.25, 4);

        let pCasa = 0;
        let pEmpate = 0;
        let pFora = 0;
        let pAmbas = 0;
        let pOver25 = 0;
        let massaTotal = 0;

        for (let golsCasa = 0; golsCasa <= 8; golsCasa += 1) {
          for (let golsFora = 0; golsFora <= 8; golsFora += 1) {
            const probabilidade =
              poisson(golsCasa, lambdaCasa) * poisson(golsFora, lambdaFora);

            massaTotal += probabilidade;

            if (golsCasa > golsFora) pCasa += probabilidade;
            else if (golsCasa < golsFora) pFora += probabilidade;
            else pEmpate += probabilidade;

            if (golsCasa > 0 && golsFora > 0) pAmbas += probabilidade;
            if (golsCasa + golsFora >= 3) pOver25 += probabilidade;
          }
        }

        if (massaTotal <= 0) {
          throw new Error('Não foi possível calcular as probabilidades.');
        }

        pCasa /= massaTotal;
        pEmpate /= massaTotal;
        pFora /= massaTotal;
        pAmbas /= massaTotal;
        pOver25 /= massaTotal;

        const probCasa = porcentagem(pCasa);
        const probEmpate = porcentagem(pEmpate);
        const probFora = porcentagem(pFora);
        const probAmbas = porcentagem(pAmbas);
        const probOver25 = porcentagem(pOver25);
        const probUnder25 = 100 - probOver25;
        const duplaCasa = Math.min(100, probCasa + probEmpate);
        const duplaFora = Math.min(100, probFora + probEmpate);

        let sugestao;
        let probPrincipal;

        if (
          probCasa >= 55 &&
          probCasa >= Math.max(probFora, probOver25, probAmbas)
        ) {
          sugestao = `Vitória ${timeCasa}`;
          probPrincipal = probCasa;
        } else if (
          probFora >= 55 &&
          probFora >= Math.max(probCasa, probOver25, probAmbas)
        ) {
          sugestao = `Vitória ${timeFora}`;
          probPrincipal = probFora;
        } else if (
          probOver25 >= 60 &&
          probOver25 >= Math.max(probCasa, probFora, probAmbas)
        ) {
          sugestao = 'Over 2.5 gols';
          probPrincipal = probOver25;
        } else if (
          probAmbas >= 55 &&
          probAmbas >= Math.max(probCasa, probFora, probOver25)
        ) {
          sugestao = 'Ambas marcam (BTTS)';
          probPrincipal = probAmbas;
        } else if (duplaCasa >= duplaFora) {
          sugestao = `Dupla chance: ${timeCasa} ou empate`;
          probPrincipal = duplaCasa;
        } else {
          sugestao = `Dupla chance: ${timeFora} ou empate`;
          probPrincipal = duplaFora;
        }

        const oddJusta = probPrincipal > 0
          ? (100 / probPrincipal).toFixed(2)
          : '—';
        const isDiamante = probPrincipal >= 75;

        painel.innerHTML = '';

        const base = document.createElement('div');
        base.style.textAlign = 'center';
        base.style.fontSize = '0.75rem';
        base.style.color = '#aaa';
        base.style.marginBottom = '10px';
        base.textContent =
          `Base: ${jogosCasa} jogos do ${timeCasa} como mandante e ` +
          `${jogosFora} jogos do ${timeFora} como visitante.`;

        const barraContainer = document.createElement('div');
        barraContainer.className = 'prob-bar-container';

        const barraCasa = document.createElement('div');
        const barraEmpate = document.createElement('div');
        const barraFora = document.createElement('div');

        barraCasa.className = 'prob-bar';
        barraEmpate.className = 'prob-bar';
        barraFora.className = 'prob-bar';
        barraCasa.style.width = `${probCasa}%`;
        barraCasa.style.background = 'var(--green)';
        barraEmpate.style.width = `${probEmpate}%`;
        barraEmpate.style.background = '#444';
        barraFora.style.width = `${probFora}%`;
        barraFora.style.background = 'var(--orange)';
        barraContainer.append(barraCasa, barraEmpate, barraFora);

        const stats = document.createElement('div');
        stats.className = 'stats';

        const statsCasa = document.createElement('span');
        const statsEmpate = document.createElement('span');
        const statsFora = document.createElement('span');
        statsCasa.style.color = 'var(--green)';
        statsFora.style.color = 'var(--orange)';
        statsCasa.textContent = `${probCasa}% Casa`;
        statsEmpate.textContent = `EMP ${probEmpate}%`;
        statsFora.textContent = `${probFora}% Fora`;
        stats.append(statsCasa, statsEmpate, statsFora);

        const mercados = document.createElement('div');
        mercados.className = 'market-grid';

        const itensMercado = [
          ['Média esperada de gols', `${lambdaCasa.toFixed(2)} x ${lambdaFora.toFixed(2)}`],
          ['🤝 Ambas marcam', `${probAmbas}%`],
          ['⚽ Over 2.5 gols', `${probOver25}%`],
          ['📉 Under 2.5 gols', `${probUnder25}%`],
        ];

        itensMercado.forEach(([rotulo, valor]) => {
          const item = document.createElement('div');
          const spanRotulo = document.createElement('span');
          const spanValor = document.createElement('span');

          item.className = 'market-item';
          spanRotulo.textContent = rotulo;
          spanValor.textContent = valor;
          item.append(spanRotulo, spanValor);
          mercados.appendChild(item);
        });

        const sugestaoBloco = document.createElement('div');
        const selo = document.createElement('div');
        const forte = document.createElement('strong');
        const odd = document.createElement('div');

        sugestaoBloco.className = 'sugestao';
        sugestaoBloco.style.background = isDiamante
          ? 'rgba(255, 215, 0, 0.1)'
          : 'rgba(0, 209, 178, 0.1)';
        sugestaoBloco.style.border = isDiamante
          ? '2px dashed var(--gold)'
          : '1px dashed var(--primary)';
        sugestaoBloco.style.color = isDiamante
          ? 'var(--gold)'
          : 'var(--primary)';

        selo.style.fontSize = '0.8rem';
        selo.style.marginBottom = '5px';
        selo.style.opacity = '0.8';
        selo.textContent = isDiamante
          ? '💎 DICA DIAMANTE (alta confiança matemática)'
          : '🎯 Sugestão do modelo Poisson';
        forte.textContent = `${sugestao} (${probPrincipal}%)`;
        odd.style.marginTop = '8px';
        odd.style.color = '#ccc';
        odd.style.fontSize = '0.85rem';
        odd.textContent = `Odd justa estimada: ${oddJusta}`;

        sugestaoBloco.append(selo, forte, document.createElement('br'), odd);

        const botaoSalvar = document.createElement('button');
        botaoSalvar.type = 'button';
        botaoSalvar.className = 'btn-save';
        botaoSalvar.textContent = '💾 Guardar no histórico';
        botaoSalvar.addEventListener('click', () => {
          salvarAposta({
            casa: timeCasa,
            fora: timeFora,
            pCasa: probCasa,
            pEmpate: probEmpate,
            pFora: probFora,
            sugestao,
            idJogoAPI,
            dataHoraReal,
            botao: botaoSalvar,
          });
        });

        painel.append(
          base,
          barraContainer,
          stats,
          mercados,
          sugestaoBloco,
          botaoSalvar,
        );

        painel.style.display = 'block';
        botao.style.display = 'none';
      } catch (erro) {
        console.error('Erro ao analisar partida:', erro);

        botao.disabled = false;
        botao.textContent = '↻ Tentar analisar novamente';
        botao.style.borderColor = 'var(--red)';
        botao.style.color = 'var(--red)';

        painel.innerHTML = '';
        const mensagem = document.createElement('div');
        mensagem.className = 'mensagem erro';

        const titulo = document.createElement('strong');
        const texto = document.createElement('p');
        titulo.textContent = 'Análise indisponível';
        texto.textContent = erro instanceof Error ? erro.message : String(erro);

        mensagem.append(titulo, texto);
        painel.appendChild(mensagem);
        painel.style.display = 'block';
      }
    }

    function poisson(k, lambda) {
      return (Math.exp(-lambda) * Math.pow(lambda, k)) / fatorial(k);
    }

    function fatorial(n) {
      if (n === 0 || n === 1) return 1;

      let resultado = 1;
      for (let i = 2; i <= n; i += 1) resultado *= i;
      return resultado;
    }

    async function salvarAposta({
      casa,
      fora,
      pCasa,
      pEmpate,
      pFora,
      sugestao,
      idJogoAPI,
      dataHoraReal,
      botao,
    }) {
      botao.disabled = true;
      botao.textContent = 'A verificar...';

      try {
        const { data: jogoExistente, error: erroBusca } = await clienteSupabase
          .from('partidas')
          .select('id')
          .eq('id_jogo_api', idJogoAPI)
          .limit(1);

        if (erroBusca) throw erroBusca;

        if (jogoExistente?.length > 0) {
          mostrarToast('Este jogo já está no histórico.', 'error');
          botao.textContent = '⚠️ Já está no histórico';
          botao.style.background = 'var(--orange)';
          botao.style.color = '#121212';
          return;
        }

        botao.textContent = 'A guardar...';

        const { error: erroSalvar } = await clienteSupabase
          .from('partidas')
          .insert([
            {
              time_casa: casa,
              time_fora: fora,
              prob_vitoria_casa: pCasa,
              prob_empate: pEmpate,
              prob_vitoria_fora: pFora,
              sugestao_aposta: sugestao,
              id_jogo_api: idJogoAPI,
              data_jogo: dataHoraReal,
            },
          ]);

        if (erroSalvar) throw erroSalvar;

        mostrarToast('Jogo salvo com sucesso! 🚀', 'success');
        botao.textContent = 'Salvo com sucesso! ✅';
        botao.style.background = 'var(--green)';
        botao.style.color = '#121212';
      } catch (erro) {
        console.error('Erro ao salvar no Supabase:', erro);
        mostrarToast('Erro ao salvar no Supabase.', 'error');
        botao.textContent = 'Tentar guardar novamente';
        botao.style.background = 'var(--red)';
        botao.disabled = false;
      }
    }
  </script>
</body>
</html>
