<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victor Tips - Diagnóstico API</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #00d1b2; --bg: #121212; --card: #1e1e1e; --green: #2ecc71; --orange: #f39c12; --red: #e74c3c; --gold: #ffd700; }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: linear-gradient(rgba(18, 18, 18, 0.85), rgba(18, 18, 18, 0.95)), url('logo.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white; 
            padding: 15px; 
            max-width: 600px; 
            margin: auto; 
        }
        
        .nav-menu { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 10px; }
        .nav-menu a { color: white; text-decoration: none; padding: 10px 15px; background: #333; border-radius: 8px; font-weight: bold; white-space: nowrap; transition: 0.2s; }
        .nav-menu a.active { background: var(--primary); color: #121212; }

        .header { text-align: center; margin-bottom: 20px; }
        h1 { color: var(--primary); margin: 0; font-size: 1.8em; }
        p { color: #aaa; font-size: 0.85em; margin-top: 5px; }
        
        .filter-container { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
        label { display: block; margin-bottom: 8px; font-size: 0.8em; color: #aaa; text-transform: uppercase; font-weight: bold; }
        select { width: 100%; padding: 12px; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 8px; font-size: 1em; cursor: pointer; }
        optgroup { font-weight: bold; color: var(--primary); background: #1e1e1e; }
        option { color: white; background: #2a2a2a; }

        .btn-scan { width: 100%; padding: 16px; background: var(--primary); border: none; border-radius: 10px; color: #121212; font-weight: bold; font-size: 1.1em; cursor: pointer; transition: 0.2s; }
        .btn-scan:disabled { background: #555; color: #888; cursor: not-allowed; }

        .resultados { margin-top: 20px; display: flex; flex-direction: column; gap: 15px; }
        .match-card { background: var(--card); padding: 15px; border-radius: 12px; border-left: 4px solid var(--primary); }
        
        .liga-tag { font-size: 0.7em; color: var(--primary); background: rgba(0,209,178,0.1); padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 10px; font-weight: bold; }
        .confronto { font-size: 1.1em; font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 15px; align-items: center; }
        .time { flex: 1; text-align: center; }
        
        .btn-analisar { width: 100%; padding: 12px; background: #2a2a2a; color: var(--primary); border: 1px solid var(--primary); border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-analisar:hover { background: var(--primary); color: #121212; }
        .btn-analisar:disabled { border-color: #555; color: #888; }

        .painel-analise { display: none; margin-top: 15px; border-top: 1px solid #333; padding-top: 15px;}
        
        .prob-bar-container { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: #333; margin-bottom: 5px; }
        .prob-bar { height: 100%; }
        .stats { display: flex; justify-content: space-between; font-size: 0.85em; color: #ccc; margin-bottom: 15px; font-weight: bold;}
        
        .market-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .market-item { background: #252525; padding: 10px; border-radius: 8px; font-size: 0.85em; border: 1px solid #333; }
        .market-item span { display: block; }
        .market-item span:first-child { color: #aaa; margin-bottom: 4px; font-size: 0.9em; }
        .market-item span:last-child { color: var(--primary); font-weight: bold; font-size: 1.1em; }

        .sugestao { padding: 12px; border-radius: 8px; font-size: 1em; text-align: center; margin-bottom: 15px; transition: 0.3s; }
        .btn-save { width: 100%; padding: 12px; background: #333; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* Estilos do Toast (Notificação) */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 12px 20px; border-radius: 8px; color: white; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transform: translateX(120%); transition: transform 0.3s ease-in-out; display: flex; align-items: center; gap: 10px; font-family: 'Segoe UI', sans-serif;}
        .toast.show { transform: translateX(0); }
        .toast.success { background: #2ecc71; }
        .toast.error { background: #e74c3c; }
        .toast.info { background: #3498db; }
    </style>
</head>
<body>

    <div class="nav-menu">
        <a href="index.html" class="active">Radar Pro</a>
        <a href="historico.html">Meu Histórico</a>
    </div>

    <div class="header">
        <h1>Victor Tips 🎯</h1>
        <p>Motor de Diagnóstico (Busca por País)</p>
    </div>

    <div class="filter-container">
        <label>Modo de Diagnóstico</label>
        <select id="filtroLiga">
            <option value="BR">🇧🇷 Buscar TODOS os jogos do Brasil hoje (Ignora ID)</option>
            <option value="72">Brasileirão - Série B (ID Original 72)</option>
            <option value="71">Brasileirão - Série A (ID 71)</option>
        </select>
    </div>

    <button id="btnEscanear" class="btn-scan" onclick="buscarJogos()">Executar Diagnóstico de Jogos</button>

    <div id="listaResultados" class="resultados"></div>

    <div id="toast-container"></div>

    <script>
        const API_KEY = '1b71c21e279516252b170cfc1fcb803d'; 
        const BASE_URL = '/api/football';
        
        const SUPABASE_URL = 'https://tvdwgfytguwlsppvjvkk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2ZHdnZnl0Z3V3bHNwcHZqdmtrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1Njk0OTEsImV4cCI6MjA5MjE0NTQ5MX0.mKbLRjWV3eoeAxUtMX-yY24hZQ-mN0aEtnhxk2pH5Us';
        const clienteSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const headersAPI = {
            'x-apisports-key': API_KEY
        };

        function mostrarToast(mensagem, tipo = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            const icone = tipo === 'success' ? '✅' : tipo === 'error' ? '⚠️' : 'ℹ️';
            toast.innerHTML = `<span>${icone}</span> <span>${mensagem}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => { toast.classList.add('show'); }, 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => { toast.remove(); }, 300);
            }, 3000);
        }

        async function buscarJogos() {
            const btn = document.getElementById('btnEscanear');
            const divResultados = document.getElementById('listaResultados');
            const opcao = document.getElementById('filtroLiga').value;
            
            btn.disabled = true;
            btn.innerText = 'A executar diagnóstico...';
            divResultados.innerHTML = '';

            try {
                const hoje = new Date();
                const dataHoje = hoje.toISOString().split('T')[0];
                
                let urlChamada = '';
                
                if (opcao === 'BR') {
                    // Busca por país e data diretamente, sem travar em IDs de liga
                    urlChamada = `${BASE_URL}/fixtures?country=Brazil&date=${dataHoje}`;
                } else {
                    urlChamada = `${BASE_URL}/fixtures?league=${opcao}&season=2026&date=${dataHoje}`;
                }

                console.log("URL de Diagnóstico:", urlChamada);
                
                const res = await fetch(urlChamada, {
                    method: 'GET',
                    headers: headersAPI
                });
                
                const data = await res.json();
                console.log("Resposta Completa da API:", data);

                if (data.errors && data.errors.requests) {
                    mostrarToast('Limite diário da API atingido.', 'error');
                    divResultados.innerHTML = `<p style="color:var(--orange); text-align:center;">Limite da API atingido.</p>`;
                    return;
                }

                const jogos = data.response;

                if (!jogos || jogos.length === 0) {
                    divResultados.innerHTML = `<p style="text-align:center; padding: 20px; background: #252525; border-radius: 8px; color: var(--orange);">Nenhum jogo encontrado para hoje com este parâmetro. Verifique a consola (F12) para detalhes do JSON.</p>`;
                } else {
                    mostrarToast(`Encontrados ${jogos.length} jogos!`, 'success');
                    jogos.forEach(jogo => {
                        // Mostrar o ID da liga no card para sabermos exatamente qual é o ID correto na API
                        const ligaIdReal = jogo.league.id;
                        const ligaNomeReal = jogo.league.name;
                        const temporadaReal = jogo.league.season;
                        renderizarCardDiagnostico(jogo, ligaIdReal, ligaNomeReal, temporadaReal);
                    });
                }
            } catch (error) {
                console.error(error);
                divResultados.innerHTML = `<p style="color:red; text-align:center;">Erro de ligação. Verifique a consola (F12).</p>`;
            } finally {
                btn.disabled = false;
                btn.innerText = 'Executar Diagnóstico de Jogos';
            }
        }

        function renderizarCardDiagnostico(jogoCompleto, ligaId, ligaNome, temporada) {
            const jogo = jogoCompleto.fixture;
            const times = jogoCompleto.teams;

            const timeCasa = times.home.name;
            const timeFora = times.away.name;
            const idCasa = times.home.id;
            const idFora = times.away.id;
            const idJogoAPI = jogo.id; 
            
            const dataJogo = new Date(jogo.date);
            const hora = dataJogo.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            
            const idCard = `jogo_${jogo.id}`;
            const card = document.createElement('div');
            card.className = 'match-card';
            card.id = idCard;
            
            card.innerHTML = `
                <div class="liga-tag">${ligaNome} (ID: ${ligaId} | Temp: ${temporada}) • 🗓️ ${hora}</div>
                <div class="confronto">
                    <span class="time" style="color:var(--green)">${timeCasa}</span>
                    <span style="color:#666; font-size: 0.8em; padding: 0 10px;">X</span>
                    <span class="time" style="color:var(--orange)">${timeFora}</span>
                </div>
                <button id="btn_${idCard}" class="btn-analisar" onclick="gerarAnaliseMatematicaReal(this, '${idCard}', '${ligaId}', ${idCasa}, ${idFora}, '${timeCasa}', '${timeFora}', ${idJogoAPI}, '${jogo.date}', ${temporada})">
                    🎯 Extrair Tabela e Analisar
                </button>
                <div class="painel-analise" id="analise_${idCard}"></div>
            `;
            document.getElementById('listaResultados').appendChild(card);
        }

        async function gerarAnaliseMatematicaReal(botao, idCard, ligaId, idCasa, idFora, timeCasa, timeFora, idJogoAPI, dataHoraReal, temporada) {
            const painel = document.getElementById(`analise_${idCard}`);
            botao.disabled = true;
            botao.innerText = '⏳ A analisar Dados...';

            try {
                const res = await fetch(`${BASE_URL}/standings?league=${ligaId}&season=${temporada}`, {
                    headers: headersAPI
                });
                const data = await res.json();

                let lambdaCasa = 1.0; 
                let lambdaFora = 1.0;
                let jogosCasa = 0;
                let jogosFora = 0;

                if (data.response && data.response.length > 0) {
                    const tabela = data.response[0].league.standings[0];
                    
                    tabela.forEach(time => {
                        if (time.team.id === idCasa && time.all.played > 0) { 
                            lambdaCasa = time.all.goals.for / time.all.played; 
                            jogosCasa = time.all.played; 
                        }
                        if (time.team.id === idFora && time.all.played > 0) { 
                            lambdaFora = time.all.goals.for / time.all.played; 
                            jogosFora = time.all.played; 
                        }
                    });
                }

                lambdaCasa = Math.min(Math.max(lambdaCasa, 0.5), 3.0);
                lambdaFora = Math.min(Math.max(lambdaFora, 0.5), 3.0);

                let pC = 0, pE = 0, pF = 0, btts = 0, o25 = 0;
                
                for (let i = 0; i <= 6; i++) {
                    for (let j = 0; j <= 6; j++) {
                        let p = poisson(i, lambdaCasa) * poisson(j, lambdaFora);
                        if (i > j) pC += p; else if (i < j) pF += p; else pE += p;
                        if (i > 0 && j > 0) btts += p;
                        if ((i + j) > 2.5) o25 += p;
                    }
                }

                const probCasa = Math.round(pC * 100); 
                const probEmpate = Math.round(pE * 100); 
                const probFora = Math.round(pF * 100);
                const probAmbas = Math.round(btts * 100); 
                const probO25 = Math.round(o25 * 100);

                let sugestao = "Análise Inconclusiva";
                let probPrincipal = 0;

                if (probCasa > 55 && probCasa >= Math.max(probFora, probO25, probAmbas)) { sugestao = `Vitória ${timeCasa}`; probPrincipal = probCasa; }
                else if (probFora > 55 && probFora >= Math.max(probCasa, probO25, probAmbas)) { sugestao = `Vitória ${timeFora}`; probPrincipal = probFora; }
                else if (probO25 > 60 && probO25 >= Math.max(probCasa, probFora, probAmbas)) { sugestao = `Over 2.5 Gols`; probPrincipal = probO25; }
                else if (probAmbas > 55 && probAmbas >= Math.max(probCasa, probFora, probO25)) { sugestao = `Ambas Marcam (BTTS)`; probPrincipal = probAmbas; }
                else { sugestao = `Dupla Chance: Casa ou Empate`; probPrincipal = probCasa + probEmpate; }

                let oddJusta = (100 / probPrincipal).toFixed(2);
                let isDiamante = probPrincipal >= 75;
                let estiloSugestao = isDiamante 
                    ? "background: rgba(255, 215, 0, 0.1); border: 2px dashed var(--gold); color: var(--gold);" 
                    : "background: rgba(0, 209, 178, 0.1); border: 1px dashed var(--primary); color: var(--primary);";
                let iconeSelo = isDiamante ? "💎 DICA DIAMANTE (Alta Confiança)" : "🎯 Dica do Poisson Real";

                painel.innerHTML = `
                    <div style="text-align:center; font-size:0.75em; color:#aaa; margin-bottom:10px;">
                        Baseado em ${jogosCasa} jogos (${timeCasa}) e ${jogosFora} jogos (${timeFora}) na temporada.
                    </div>
                    <div class="prob-bar-container">
                        <div class="prob-bar" style="width: ${probCasa}%; background: var(--green);"></div>
                        <div class="prob-bar" style="width: ${probEmpate}%; background: #444;"></div>
                        <div class="prob-bar" style="width: ${probFora}%; background: var(--orange);"></div>
                    </div>
                    <div class="stats"><span style="color:var(--green)">${probCasa}% Casa</span><span>EMP ${probEmpate}%</span><span style="color:var(--orange)">${probFora}% Fora</span></div>
                    
                    <div class="market-grid">
                        <div class="market-item"><span>Média Gols Feitos</span> <span>${lambdaCasa.toFixed(1)} x ${lambdaFora.toFixed(1)}</span></div>
                        <div class="market-item"><span>🤝 Ambas Marcam</span> <span>${probAmbas}%</span></div>
                        <div class="market-item"><span>⚽ Over 2.5 Gols</span> <span>${probO25}%</span></div>
                        <div class="market-item"><span>📉 Under 2.5 Gols</span> <span>${100 - probO25}%</span></div>
                    </div>

                    <div class="sugestao" style="${estiloSugestao}">
                        <div style="font-size: 0.8em; margin-bottom: 5px; opacity: 0.8;">${iconeSelo}</div>
                        <strong>${sugestao} (${probPrincipal}%)</strong><br>
                        <div style="font-size: 0.85em; color: #ccc; margin-top: 8px;">
                            Odd Justa Mínima: <strong style="color: white; font-size: 1.1em;">${oddJusta}</strong>
                        </div>
                    </div>
                    
                    <button class="btn-save" onclick="salvarAposta('${timeCasa}','${timeFora}',${probCasa},${probEmpate},${probFora},'${sugestao}', ${idJogoAPI}, '${dataHoraReal}', this)">💾 Guardar no Histórico</button>
                `;
                
                painel.style.display = 'block';
                botao.style.display = 'none';

            } catch (error) {
                console.error(error);
                botao.innerText = '❌ Erro ao extrair dados';
                botao.style.borderColor = 'var(--red)';
                botao.style.color = 'var(--red)';
            }
        }

        function poisson(k, lambda) { return (Math.exp(-lambda) * Math.pow(lambda, k)) / fatorial(k); }
        function fatorial(n) { if (n === 0 || n === 1) return 1; let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }

        async function salvarAposta(casa, fora, pC, pE, pF, sug, idJogoAPI, dataHoraReal, btn) {
            btn.disabled = true;
            btn.innerText = "A verificar...";

            try {
                const { data: jogoExistente, error: erroBusca } = await clienteSupabase
                    .from('partidas')
                    .select('id')
                    .eq('id_jogo_api', idJogoAPI);

                if (erroBusca) throw erroBusca;

                if (jogoExistente && jogoExistente.length > 0) {
                    mostrarToast('Este jogo já está no seu Histórico!', 'error');
                    btn.innerText = "⚠️ Já está no Histórico!";
                    btn.style.background = "var(--orange)";
                    btn.style.color = "#121212";
                    return; 
                }

                btn.innerText = "A guardar...";
                
                const { error: erroSalvar } = await clienteSupabase.from('partidas').insert([{ 
                    time_casa: casa, 
                    time_fora: fora, 
                    prob_vitoria_casa: pC, 
                    prob_empate: pE, 
                    prob_vitoria_fora: pF, 
                    sugestao_aposta: sug, 
                    id_jogo_api: idJogoAPI,
                    data_jogo: dataHoraReal 
                }]);

                if (erroSalvar) throw erroSalvar;

                mostrarToast('Jogo salvo com sucesso! 🚀', 'success');
                btn.innerText = "Salvo com Sucesso! ✅"; 
                btn.style.background = "var(--green)"; 
                btn.style.color = "#121212";

            } catch (erro) {
                mostrarToast('Erro de ligação com o Supabase.', 'error');
                btn.innerText = "Erro ao Guardar"; 
                btn.style.background = "var(--red)"; 
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
