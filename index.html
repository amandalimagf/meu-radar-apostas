<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victor Tips - Radar Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(rgba(18, 18, 18, 0.9), rgba(18, 18, 18, 0.95)), url('logo.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white; 
            padding: 15px; 
            max-width: 600px; 
            margin: auto; 
        }
        
        /* Menu de Navegação */
        .nav-menu { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; overflow-x: auto; }
        .nav-menu a { color: white; text-decoration: none; padding: 10px 15px; background: #333; border-radius: 8px; font-weight: bold; white-space: nowrap; transition: 0.2s; }
        .nav-menu a.active { background: #00d1b2; color: #121212; }
        .nav-menu a:hover:not(.active) { background: #444; }

        h1 { text-align: center; color: #00d1b2; margin-bottom: 20px; }

        /* Estilo dos Cards de Jogos */
        .card { background: rgba(30, 30, 30, 0.9); padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 5px solid #00d1b2; }
        .data-badge { font-size: 0.75em; color: #aaa; margin-bottom: 5px; display: block; }
        .times { font-size: 1.1em; font-weight: bold; margin-bottom: 10px; }
        .sugestao-box { background: rgba(0, 209, 178, 0.1); padding: 10px; border-radius: 6px; border: 1px dashed #00d1b2; margin-bottom: 15px; }
        .btn-salvar { width: 100%; padding: 12px; background: #00d1b2; border: none; border-radius: 8px; color: #121212; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-salvar:hover { background: #00b39a; transform: translateY(-2px); }

        /* --- SISTEMA DE TOAST (NOTIFICAÇÕES) --- */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 12px 20px; border-radius: 8px; color: white; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transform: translateX(120%); transition: transform 0.3s ease-in-out; display: flex; align-items: center; gap: 10px; font-family: 'Segoe UI', sans-serif;}
        .toast.show { transform: translateX(0); }
        .toast.success { background: #2ecc71; }
        .toast.error { background: #e74c3c; }
        .toast.info { background: #3498db; }
    </style>
</head>
<body>

    <div class="nav-menu">
        <a href="index.html" class="active">Radar Pro</a>
        <a href="historico.html">Meu Histórico</a>
    </div>

    <h1>Radar de Análises 🎯</h1>

    <!-- Container onde os jogos da API vão aparecer -->
    <div id="listaJogosDia"></div>

    <!-- Container obrigatório para os Alertas Bonitos -->
    <div id="toast-container"></div>

    <script>
        // Configurações do Supabase (Mantenha as suas chaves intactas)
        const SUPABASE_URL = 'https://tvdwgfytguwlsppvjvkk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2ZHdnZnl0Z3V3bHNwcHZqdmtrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1Njk0OTEsImV4cCI6MjA5MjE0NTQ5MX0.mKbLRjWV3eoeAxUtMX-yY24hZQ-mN0aEtnhxk2pH5Us';
        const clienteSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- FUNÇÃO DO TOAST (SUBSTITUI OS ALERTS) ---
        function mostrarToast(mensagem, tipo = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            const icone = tipo === 'success' ? '✅' : tipo === 'error' ? '⚠️' : 'ℹ️';
            toast.innerHTML = `<span>${icone}</span> <span>${mensagem}</span>`;
            
            container.appendChild(toast);
            
            // Animação de entrada
            setTimeout(() => { toast.classList.add('show'); }, 10);
            
            // Tempo para sumir (3 segundos)
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => { toast.remove(); }, 300); // Remove do HTML
            }, 3000);
        }

        // --- FUNÇÃO PARA SALVAR O JOGO NO HISTÓRICO COM TRAVA DE SEGURANÇA ---
        async function salvarJogo(idJogoApi, timeCasa, timeFora, sugestaoAposta, dataJogo) {
            
            mostrarToast('Processando...', 'info');

            try {
                // 1. TRAVA DE SEGURANÇA: Verifica se o jogo já existe no banco
                const { data: jogoExistente, error: erroBusca } = await clienteSupabase
                    .from('partidas')
                    .select('id')
                    .eq('id_jogo_api', idJogoApi);

                if (erroBusca) throw erroBusca;

                if (jogoExistente && jogoExistente.length > 0) {
                    // Substituímos o alert() pelo Toast de Erro
                    mostrarToast('Este jogo já está salvo no seu Histórico!', 'error');
                    return; // Para a função aqui e não salva duplicado
                }

                // 2. SALVAMENTO: Se não existe, envia para o Supabase
                const { error: erroSalvar } = await clienteSupabase
                    .from('partidas')
                    .insert([{
                        id_jogo_api: idJogoApi,
                        time_casa: timeCasa,
                        time_fora: timeFora,
                        sugestao_aposta: sugestaoAposta,
                        data_jogo: dataJogo
                    }]);

                if (erroSalvar) throw erroSalvar;

                // Substituímos o alert() pelo Toast de Sucesso
                mostrarToast('Jogo salvo com sucesso! 🚀', 'success');

            } catch (erro) {
                console.error("Erro no processo:", erro);
                mostrarToast('Erro de conexão. O Supabase pode estar pausado.', 'error');
            }
        }

        // --- EXEMPLO DE COMO OS BOTÕES NO SEU RADAR DEVEM CHAMAR A FUNÇÃO ---
        // Quando você for puxar os dados da API de Futebol e criar os cards no JS,
        // o botão de salvar deve ter o onclick chamando a função salvarJogo, passando as variáveis.
        // Abaixo é apenas uma simulação visual para você testar se o botão e o toast estão funcionando:

        function simularCardNaTela() {
            const div = document.getElementById('listaJogosDia');
            
            // Dados fictícios simulando a vinda da API
            const jogoExemplo = {
                id_api: 1234567,
                casa: "Man City",
                fora: "Aston Villa",
                data: "2024-05-24T12:00:00",
                sugestao: "Dupla Chance: Casa ou Empate"
            };

            const dataFormatada = new Date(jogoExemplo.data).toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});

            div.innerHTML = `
                <div class="card">
                    <span class="data-badge">📅 Premier League • ${dataFormatada}</span>
                    <div class="times">${jogoExemplo.casa} x ${jogoExemplo.fora}</div>
                    <div class="sugestao-box">
                        <small style="color: #aaa;">🎯 Dica do Poisson Real</small><br>
                        <strong>${jogoExemplo.sugestao}</strong>
                    </div>
                    <!-- Preste atenção nesta linha abaixo: é assim que o botão chama a função salvarJogo -->
                    <button class="btn-salvar" onclick="salvarJogo(${jogoExemplo.id_api}, '${jogoExemplo.casa}', '${jogoExemplo.fora}', '${jogoExemplo.sugestao}', '${jogoExemplo.data}')">
                        💾 Salvar no Histórico
                    </button>
                </div>
            `;
        }

        // Chama a função para desenhar a tela (Substitua pela sua função real de buscar na API)
        simularCardNaTela();

    </script>
</body>
</html>
