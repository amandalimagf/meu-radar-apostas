<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victor Tips - Histórico Profissional</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(rgba(18, 18, 18, 0.9), rgba(18, 18, 18, 0.95)), url('logo.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white; padding: 15px; max-width: 600px; margin: auto; 
        }
        .nav-menu { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; overflow-x: auto; }
        .nav-menu a { color: white; text-decoration: none; padding: 10px 15px; background: #333; border-radius: 8px; font-weight: bold; white-space: nowrap; }
        .nav-menu a.active { background: #00d1b2; color: #121212; }
        
        .dash-container { display: grid; gap: 10px; margin-bottom: 10px; text-align: center; }
        .dash-grid-4 { grid-template-columns: repeat(4, 1fr); }
        .dash-grid-2 { grid-template-columns: 1fr 1fr; margin-bottom: 20px; }
        
        .dash-item { background: rgba(30, 30, 30, 0.9); padding: 12px 5px; border-radius: 8px; border: 1px solid #333; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.2s;}
        .dash-label { font-size: 0.65em; color: #aaa; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; text-align: center;}
        .dash-valor { font-size: 1.3em; font-weight: bold; color: white; text-align: center;}

        .clicavel { cursor: pointer; }
        .clicavel:hover { background: rgba(50, 50, 50, 0.9); transform: translateY(-3px); }
        .filtro-ativo-todos { border-color: white !important; box-shadow: 0 0 8px rgba(255,255,255,0.3); }
        .filtro-ativo-green { border-color: #2ecc71 !important; box-shadow: 0 0 8px rgba(46,204,113,0.4); }
        .filtro-ativo-red { border-color: #e74c3c !important; box-shadow: 0 0 8px rgba(231,76,60,0.4); }

        .btn-check, .btn-carregar-mais { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-check { background: #00d1b2; color: #121212; margin-bottom: 10px; }
        .btn-check:hover { background: #00b39a; }
        .btn-carregar-mais { background: #333; color: white; margin-top: 15px; margin-bottom: 30px; display: none; }
        .btn-carregar-mais:hover { background: #444; }
        
        .card { background: rgba(30, 30, 30, 0.9); padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 5px solid #444; position: relative;}
        .green { border-left-color: #2ecc71; }
        .red { border-left-color: #e74c3c; }
        
        .status-badge { float: right; font-size: 0.7em; padding: 3px 8px; border-radius: 4px; background: #444; font-weight: bold; }
        .data-badge { font-size: 0.75em; color: #aaa; margin-bottom: 5px; display: block; }
        .placar-box { background: rgba(0,0,0,0.3); padding: 5px 10px; border-radius: 6px; font-weight: bold; color: #00d1b2; margin-top: 10px; display: inline-block; }

        select.filtro-mes { width: 100%; padding: 12px; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 8px; font-size: 1em; margin-bottom: 15px; cursor: pointer; }

        /* Estilos dos Gráficos Corrigidos */
        .graficos-container { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        .grafico-box { background: rgba(30, 30, 30, 0.9); padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .grafico-titulo { text-align: center; font-size: 0.85em; color: #aaa; margin-bottom: 15px; font-weight: bold; text-transform: uppercase; }
        /* Adicionámos um wrapper para controlar o tamanho exato do gráfico */
        .grafico-wrapper { position: relative; height: 260px; width: 100%; display: flex; justify-content: center; }

        /* Estilos do Toast (Notificação) */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 12px 20px; border-radius: 8px; color: white; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transform: translateX(120%); transition: transform 0.3s ease-in-out; display: flex; align-items: center; gap: 10px; }
        .toast.show { transform: translateX(0); }
        .toast.success { background: #2ecc71; }
        .toast.error { background: #e74c3c; }
        .toast.info { background: #3498db; }
    </style>
</head>
<body>

    <div class="nav-menu">
        <a href="index.html">Radar Pro</a>
        <a href="historico.html" class="active">Meu Histórico</a>
    </div>

    <h1 style="text-align: center; color: #00d1b2; margin-bottom: 15px;">Desempenho 📊</h1>

    <select id="filtroMes" class="filtro-mes" onchange="mudarFiltroMes()">
        <option value="todos">Todos os Meses</option>
    </select>

    <div class="dash-container dash-grid-4">
        <div class="dash-item clicavel filtro-ativo-todos" id="cardDashTotal" onclick="alterarFiltroStatus('todos')">
            <div class="dash-label">Total</div><div id="dashTotal" class="dash-valor">0</div>
        </div>
        <div class="dash-item clicavel" id="cardDashGreen" onclick="alterarFiltroStatus('green')">
            <div class="dash-label">Greens</div><div id="dashGreen" class="dash-valor" style="color: #2ecc71;">0</div>
        </div>
        <div class="dash-item clicavel" id="cardDashRed" onclick="alterarFiltroStatus('red')">
            <div class="dash-label">Reds</div><div id="dashRed" class="dash-valor" style="color: #e74c3c;">0</div>
        </div>
        <div class="dash-item">
            <div class="dash-label">Acerto</div><div id="dashTaxa" class="dash-valor" style="color: #00d1b2;">0%</div>
        </div>
    </div>

    <div class="dash-container dash-grid-2">
        <div class="dash-item" style="border-color: #f39c12;"><div class="dash-label" style="color: #f39c12;">🏆 Melhor Mercado</div><div id="dashMercado" class="dash-valor" style="font-size: 1.1em;">-</div></div>
        <div class="dash-item" style="border-color: #ff4757;"><div class="dash-label" style="color: #ff4757;">🔥 Sequência Atual</div><div id="dashStreak" class="dash-valor" style="font-size: 1.1em;">0</div></div>
    </div>

    <div class="graficos-container">
        <div class="grafico-box">
            <div class="grafico-titulo">Distribuição de Mercados</div>
            <div class="grafico-wrapper">
                <canvas id="graficoMercados"></canvas>
            </div>
        </div>
    </div>

    <button class="btn-check" id="btnAutoCheck" onclick="verificarResultadosAutomatico()">🤖 Conferir Resultados via API</button>

    <div id="listaHistorico"></div>
    <button class="btn-carregar-mais" id="btnCarregarMais" onclick="carregarMaisJogos()">⏬ Carregar Mais Antigos</button>

    <div id="toast-container"></div>

    <script>
        const API_KEY = 'b9ba384b106c433686606c4dfa53261a';
        const BASE_URL = '/api/football';
        const SUPABASE_URL = 'https://tvdwgfytguwlsppvjvkk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2ZHdnZnl0Z3V3bHNwcHZqdmtrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1Njk0OTEsImV4cCI6MjA5MjE0NTQ5MX0.mKbLRjWV3eoeAxUtMX-yY24hZQ-mN0aEtnhxk2pH5Us';
        const clienteSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let todosOsJogos = [];
        let statusFiltroAtual = 'todos'; 
        
        let paginaAtual = 1;
        const itensPorPagina = 20;
        let graficoMercadosRef = null;

        function mostrarToast(mensagem, tipo = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            const icone = tipo === 'success' ? '✅' : tipo === 'error' ? '⚠️' : 'ℹ️';
            toast.innerHTML = `<span>${icone}</span> <span>${mensagem}</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => { toast.classList.add('show'); }, 10); 
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => { toast.remove(); }, 300); 
            }, 3000);
        }

        async function carregarHistorico() {
            const { data } = await clienteSupabase.from('partidas').select('*').order('id', { ascending: false });
            if (data) {
                todosOsJogos = data;
                preencherFiltroMes(data);
                renderizarTela();
            }
        }

        function preencherFiltroMes(data) {
            const select = document.getElementById('filtroMes');
            const mesesUnicos = new Set();
            data.forEach(item => {
                if (item.data_jogo) {
                    const dataObj = new Date(item.data_jogo);
                    if (!isNaN(dataObj)) {
                        mesesUnicos.add(`${dataObj.getFullYear()}-${String(dataObj.getMonth() + 1).padStart(2, '0')}`);
                    }
                }
            });
            Array.from(mesesUnicos).sort().reverse().forEach(mesAno => {
                const [ano, mes] = mesAno.split('-');
                const nomeMes = new Date(ano, mes - 1).toLocaleString('pt-BR', { month: 'long', year: 'numeric' });
                const option = document.createElement('option');
                option.value = mesAno;
                option.text = nomeMes.charAt(0).toUpperCase() + nomeMes.slice(1);
                select.appendChild(option);
            });
        }

        function mudarFiltroMes() {
            paginaAtual = 1; 
            renderizarTela();
        }

        function alterarFiltroStatus(status) {
            statusFiltroAtual = status;
            paginaAtual = 1; 
            
            document.getElementById('cardDashTotal').classList.remove('filtro-ativo-todos');
            document.getElementById('cardDashGreen').classList.remove('filtro-ativo-green');
            document.getElementById('cardDashRed').classList.remove('filtro-ativo-red');
            
            if(status === 'todos') document.getElementById('cardDashTotal').classList.add('filtro-ativo-todos');
            if(status === 'green') document.getElementById('cardDashGreen').classList.add('filtro-ativo-green');
            if(status === 'red') document.getElementById('cardDashRed').classList.add('filtro-ativo-red');

            renderizarTela();
        }

        function carregarMaisJogos() {
            paginaAtual++;
            renderizarTela(false); 
        }

        function renderizarTela(recalcularTudo = true) {
            const mesSelecionado = document.getElementById('filtroMes').value;
            const div = document.getElementById('listaHistorico');
            
            let total = 0, greens = 0, reds = 0, streak = 0;
            let contandoStreak = true;
            let mercados = { 'Over 2.5': { total: 0, greens: 0 }, 'Ambas Marcam': { total: 0, greens: 0 }, 'Dupla Chance': { total: 0, greens: 0 }, 'Vitória Casa': { total: 0, greens: 0 }, 'Vitória Fora': { total: 0, greens: 0 } };

            let jogosFiltradosMes = todosOsJogos;
            if (mesSelecionado !== 'todos') {
                jogosFiltradosMes = todosOsJogos.filter(item => item.data_jogo && item.data_jogo.startsWith(mesSelecionado));
            }

            jogosFiltradosMes.slice().reverse().forEach(item => {
                if (item.resultado === 'green') { greens++; total++; if(contandoStreak) streak++; }
                else if (item.resultado === 'red') { reds++; total++; contandoStreak = false; streak = 0; }
                
                if (item.resultado) {
                    let sug = item.sugestao_aposta || '';
                    let tipo = sug.includes('Over 2.5') ? 'Over 2.5' : sug.includes('Ambas') ? 'Ambas Marcam' : sug.includes('Dupla') ? 'Dupla Chance' : sug.includes(item.time_casa) ? 'Vitória Casa' : 'Vitória Fora';
                    if (mercados[tipo]) { mercados[tipo].total++; if (item.resultado === 'green') mercados[tipo].greens++; }
                }
            });

            let listaVisual = jogosFiltradosMes;
            if (statusFiltroAtual !== 'todos') {
                listaVisual = jogosFiltradosMes.filter(item => item.resultado === statusFiltroAtual);
            }

            listaVisual = [...listaVisual].sort((a, b) => {
                const peso = (r) => r === 'green' ? 1 : r === 'red' ? 2 : 0;
                if (peso(a.resultado) !== peso(b.resultado)) return peso(a.resultado) - peso(b.resultado);
                const dataTempoA = a.data_jogo ? new Date(a.data_jogo).getTime() : 0;
                const dataTempoB = b.data_jogo ? new Date(b.data_jogo).getTime() : 0;
                return dataTempoB - dataTempoA;
            });

            const itensExibidos = listaVisual.slice(0, paginaAtual * itensPorPagina);
            const btnCarregarMais = document.getElementById('btnCarregarMais');
            
            if (listaVisual.length > paginaAtual * itensPorPagina) {
                btnCarregarMais.style.display = 'block';
            } else {
                btnCarregarMais.style.display = 'none';
            }

            div.innerHTML = '';
            itensExibidos.forEach(item => {
                const corClasse = item.resultado === 'green' ? 'green' : (item.resultado === 'red' ? 'red' : '');
                let dataFormatada = "Data indisponível";
                if (item.data_jogo) {
                    const dataObj = new Date(item.data_jogo);
                    if (!isNaN(dataObj)) dataFormatada = dataObj.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
                }

                div.innerHTML += `
                    <div class="card ${corClasse}">
                        <span class="status-badge">${item.resultado ? item.resultado.toUpperCase() : 'PENDENTE'}</span>
                        <span class="data-badge">📅 ${dataFormatada}</span>
                        <strong>${item.time_casa} x ${item.time_fora}</strong><br>
                        <small>🎯 Sugestão: ${item.sugestao_aposta}</small>
                        ${item.placar ? `<br><div class="placar-box">Placar: ${item.placar}</div>` : ''}
                    </div>
                `;
            });

            if (recalcularTudo) {
                document.getElementById('dashTotal').innerText = total;
                document.getElementById('dashGreen').innerText = greens;
                document.getElementById('dashRed').innerText = reds;
                const taxa = total > 0 ? Math.round((greens / total) * 100) : 0;
                document.getElementById('dashTaxa').innerText = `${taxa}%`;
                document.getElementById('dashStreak').innerText = `${streak} 🔥`;
                
                let melhorM = 'Nenhum', maxT = -1;
                for (const [n, s] of Object.entries(mercados)) {
                    let t = s.total > 0 ? (s.greens / s.total) * 100 : -1;
                    if (t > maxT) { maxT = t; melhorM = n; }
                }
                document.getElementById('dashMercado').innerText = maxT > -1 ? `${melhorM} (${Math.round(maxT)}%)` : `---`;

                desenharGraficos(mercados);
            }
        }

        function desenharGraficos(mercados) {
            Chart.defaults.color = '#ccc';
            Chart.defaults.font.family = "'Segoe UI', sans-serif";

            const ctxMercados = document.getElementById('graficoMercados').getContext('2d');
            if (graficoMercadosRef) graficoMercadosRef.destroy();

            const nomesMercados = Object.keys(mercados).filter(k => mercados[k].total > 0);
            const totaisMercados = nomesMercados.map(k => mercados[k].total);

            graficoMercadosRef = new Chart(ctxMercados, {
                type: 'doughnut',
                data: {
                    labels: nomesMercados,
                    datasets: [{
                        data: totaisMercados,
                        backgroundColor: ['#3498db', '#9b59b6', '#f1c40f', '#e67e22', '#1abc9c'],
                        borderWidth: 0
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    cutout: '65%', // Deixa a "rosquinha" mais fina e elegante
                    plugins: { 
                        legend: { 
                            position: 'bottom', // Move a legenda para o fundo, evitando espremer o gráfico
                            labels: { 
                                boxWidth: 12,
                                padding: 15,
                                font: { size: 11 }
                            } 
                        } 
                    } 
                }
            });
        }

        async function verificarResultadosAutomatico() {
            const btn = document.getElementById('btnAutoCheck');
            btn.disabled = true; btn.innerText = '🤖 A verificar...';
            mostrarToast('A procurar resultados na API...', 'info');

            const { data: pendentes } = await clienteSupabase.from('partidas').select('*').is('resultado', null).not('id_jogo_api', 'is', null);
            
            if (!pendentes || pendentes.length === 0) { 
                mostrarToast('Nenhum jogo pendente para verificar.', 'info');
                btn.disabled = false; btn.innerText = '🤖 Conferir Resultados via API'; 
                return; 
            }

            let conferidos = 0;

            for (const aposta of pendentes) {
                try {
                    const res = await fetch(`${BASE_URL}/matches/${aposta.id_jogo_api}`, { headers: { 'X-Auth-Token': API_KEY } });
                    const jogo = await res.json();
                    
                    if (jogo.status === 'FINISHED') {
                        const h = jogo.score.fullTime.home;
                        const a = jogo.score.fullTime.away;
                        const placarString = `${h} x ${a}`;
                        const totalGols = h + a;
                        let deu = false;
                        const s = aposta.sugestao_aposta.toLowerCase();

                        if (s.includes('over 2.5') && totalGols > 2.5) deu = true;
                        else if (s.includes('vitória') && s.includes(aposta.time_casa.toLowerCase()) && h > a) deu = true;
                        else if (s.includes('vitória') && s.includes(aposta.time_fora.toLowerCase()) && a > h) deu = true;
                        else if (s.includes('ambas') && h > 0 && a > 0) deu = true;
                        else if (s.includes('casa ou empate') && h >= a) deu = true;

                        await clienteSupabase.from('partidas').update({ 
                            resultado: deu ? 'green' : 'red',
                            placar: placarString 
                        }).eq('id', aposta.id);
                        
                        conferidos++;
                    }
                } catch (e) { console.error(e); }
            }
            
            if (conferidos > 0) {
                mostrarToast(`${conferidos} jogo(s) atualizado(s)! A recarregar...`, 'success');
                setTimeout(() => { location.reload(); }, 2000);
            } else {
                mostrarToast('Nenhum jogo foi finalizado ainda.', 'info');
                btn.disabled = false; btn.innerText = '🤖 Conferir Resultados via API';
            }
        }
        carregarHistorico();
    </script>
</body>
</html>
